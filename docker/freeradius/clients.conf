##
## clients.conf -- Daftar NAS/AP yang diizinkan mengakses FreeRADIUS
##
## Untuk development: izinkan semua dengan secret default.
## Di production, ganti dengan IP spesifik router/AP kamu.
##

client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    shortname = localhost
    nastype = other
}

## Izinkan semua client dari network docker internal
client docker_network {
    ipaddr = 172.16.0.0/12
    secret = ${RADIUS_NAS_SECRET:-testing123}
    shortname = docker
    nastype = other
}

## Izinkan semua (untuk dev/testing).
## HAPUS atau PERKETAT di production!
client all {
    ipaddr = 0.0.0.0/0
    secret = testing123
    shortname = any
    nastype = other
}
