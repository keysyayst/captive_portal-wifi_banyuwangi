services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: captive_portal_app
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://wifi.tail71c72d.ts.net
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=captive_portal
      - DB_USERNAME=captive_user
      - DB_PASSWORD=captive_secret
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=debug
      - RADIUS_MODE=${RADIUS_MODE:-mock}
    volumes:
      - ./.env:/var/www/html/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - captive_network

  db:
    image: mysql:8.0
    container_name: captive_portal_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=captive_portal
      - MYSQL_USER=captive_user
      - MYSQL_PASSWORD=captive_secret
      - MYSQL_ROOT_PASSWORD=root_secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - captive_network

  freeradius:
    image: freeradius/freeradius-server:latest
    container_name: captive_portal_radius
    restart: unless-stopped
    command: freeradius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./docker/freeradius/radiusd.conf:/etc/freeradius/radiusd.conf:ro
      - ./docker/freeradius/clients.conf:/etc/freeradius/clients.conf:ro
      - ./docker/freeradius/mods-enabled/sql:/etc/freeradius/mods-enabled/sql:ro
      - ./docker/freeradius/sites-enabled/default:/etc/freeradius/sites-enabled/default:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - captive_network
    environment:
      - RADIUS_DB_HOST=db
      - RADIUS_DB_PORT=3306
      - RADIUS_DB_NAME=captive_portal
      - RADIUS_DB_USER=captive_user
      - RADIUS_DB_PASS=captive_secret
      - RADIUS_NAS_SECRET=IaWukVJiBJi4y3JV0iyx/fwpaRjCxRb4

volumes:
  db_data:

networks:
  captive_network:
    driver: bridge
