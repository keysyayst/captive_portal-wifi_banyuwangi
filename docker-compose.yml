version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: captive_portal_app
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=captive_portal
      - DB_USERNAME=captive_user
      - DB_PASSWORD=captive_secret
    volumes:
      - ./.env:/var/www/html/.env
    depends_on:
      - db
    networks:
      - captive_network

  db:
    image: mysql:8.0
    container_name: captive_portal_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=captive_portal
      - MYSQL_USER=captive_user
      - MYSQL_PASSWORD=captive_secret
      - MYSQL_ROOT_PASSWORD=root_secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - captive_network

volumes:
  db_data:

networks:
  captive_network:
    driver: bridge
